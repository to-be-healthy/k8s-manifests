# These secrets are created from .env files; do NOT commit real values.
# Regenerate with: deploy/k8s/scripts/apply-secrets.sh
# Required Secret names in namespace tobehealthy:
#   - db-credentials (MYSQL_ROOT_PASSWORD, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD)
#   - redis-credentials (REDIS_PASSWORD)
#   - backend-env (from backend/.env, --from-env-file)
#   - frontend-env (INTERNAL_API_URL)
