apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tobehealthy
  namespace: tobehealthy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [geonganghaejim.site]
      secretName: geonganghaejim-tls
  rules:
    - host: geonganghaejim.site
      http:
        paths:
          - path: /api/callback/apple
            pathType: Exact
            backend:
              service:
                name: frontend
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /api-docs
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /files
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tobehealthy-www-redirect
  namespace: tobehealthy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/permanent-redirect: https://geonganghaejim.site/
spec:
  ingressClassName: nginx
  tls:
    - hosts: [www.geonganghaejim.site]
      secretName: www-geonganghaejim-tls
  rules:
    - host: www.geonganghaejim.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
